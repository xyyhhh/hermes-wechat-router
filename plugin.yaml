name: wechat-router
label: WeChat Message Router
kind: platform
version: 0.4.0
description: Batch WeChat messages, detect follow-up events with Jev, and hand them to one main assistant through Hermes Kanban.
author: xyyhhh
license: MIT
requires_hermes: ">=0.21.4"
python_dependencies:
  - "aiohttp>=3.10,<4"
provides_tools:
  - wechat_router_status
requires_env:
  - name: WECHAT_ROUTER_SECRET
    description: HMAC secret shared with your external message listener.
    password: true
