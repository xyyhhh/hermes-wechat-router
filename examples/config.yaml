# Merge into the gateway owner's config.yaml. Do not replace the whole file.
plugins:
  enabled:
    - wechat-router

platforms:
  wechat_router:
    enabled: true
    extra:
      host: 127.0.0.1
      port: 8768
      mode: observe # observe calls Jev, but creates no Kanban tasks; change to active when ready
      owner_name: 我
      owner_ids: [YOUR_WECHAT_ID]
      sources: [wechat-listener]
      timezone: Asia/Shanghai
      quiet_seconds: 8
      max_wait_seconds: 60
      model: jev-latest
      provider: typesafe # custom for a third-party TypeSafe System One compatible service
      provider_base_url: "" # e.g. https://provider.example/v1; uses WECHAT_ROUTER_API_KEY
      # jev_instructions: | # optional; omit to use the built-in policy
      #   Focus on appointments, deadlines and important events relevant to the owner.
      board: default
      assistant_profile: assistant
      decision_mode: bool # bool -> native Noul; choice -> ignore/watch/act
      bool_threshold: 0.6
      # decision_question: Does this batch contain an event the main assistant should follow up?
      # positive_criteria: Relevant appointments, deadlines, commitments or important updates.
      # negative_criteria: Chitchat or unrelated/duplicate messages with no follow-up needed.
