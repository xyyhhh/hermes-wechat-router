# Merge into the gateway owner's config.yaml. Do not replace the whole file.
plugins:
  enabled:
    - wechat-router

platforms:
  wechat_router:
    enabled: true
    extra:
      host: 127.0.0.1
      port: 8768
      receive_only: true # only receive until a key is configured and processing is explicitly resumed
      mode: observe # observe calls the selected decision model, but creates no Kanban tasks; change to active when ready
      owner_name: 你的姓名
      owner_aliases: [你的群昵称]
      sender_rules: [] # configure source/sender_id, optional conversation_id, name, aliases, importance, role in Dashboard
      owner_ids: [YOUR_WECHAT_ID]
      sources: [wechat-listener]
      timezone: Asia/Shanghai
      quiet_seconds: 8
      max_wait_seconds: 60
      model: jev-latest # for provider: google, use gemini-decision-1 and GEMINI_API_KEY
      provider: typesafe # google -> Gemini Decisions; custom -> System One compatible service
      provider_base_url: "" # e.g. https://provider.example/v1; uses WECHAT_ROUTER_API_KEY
      # jev_instructions: | # optional; omit to use the built-in policy
      #   Detect time-plan signals and updates, including unconfirmed invitations.
      board: default
      assistant_profile: assistant
      decision_mode: bool # bool -> native Noul; choice -> ignore/watch/act
      bool_threshold: 0.6
      # decision_question: Does this batch contain a time-plan signal or update?
      # positive_criteria: Appointments, invitations, plans, deadlines and their updates.
      # negative_criteria: No time-plan signal in current messages; history alone must not trigger.
