name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 71736c9f32597bbca9d89cede5aa136e55946b2f
          path: .hermes-reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[test]' ruamel.yaml python-dotenv rich requests croniter pydantic tomli-w loguru
      - run: python scripts/verify_hermes.py --hermes-source .hermes-reference
